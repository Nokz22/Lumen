server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Vite fingerprints these filenames, so a changed file is a changed URL and the old
    # one is safe to cache indefinitely.
    location /assets/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # The app shell must never be cached: it is what points at the fingerprinted bundles,
    # and a cached copy strands people on the previous deploy's JavaScript.
    location = /index.html {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: /privacy and /companion are React routes, not files on disk,
    # so anything that is not a real file falls back to the app shell.
    location / {
        include   /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

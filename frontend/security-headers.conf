# Included into every location rather than set once at server level, because nginx's
# add_header does not merge: a location that declares any add_header of its own discards
# every one inherited from the enclosing block. Setting these at server level looks
# correct and silently drops them on the two locations below that set their own
# Cache-Control — including the one that serves the app shell for every route.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

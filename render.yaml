# Render Blueprint. Creates the API and its database; apply it with Render's
# "New > Blueprint" against this repository. See docs/deployment.md for the parts
# that need an account and cannot be declared here.
#
# RabbitMQ is deliberately absent: Render has no managed broker, and the project is
# not going to drop the messaging architecture it exists to demonstrate (ADR-0007)
# to fit one platform's catalogue. Point RABBITMQ_* at an external broker.

services:
  - type: web
    name: lumen-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health/readiness
    # Deploys are triggered by the CD workflow after CI is green, never by a bare
    # push — see .github/workflows/deploy.yml.
    autoDeploy: false
    envVars:
      # "demo" alongside "prod": a public instance keeps every production hardening
      # and is filled with synthetic history so it is worth opening. Drop it to run
      # a real deployment with real people in it.
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo

      # Wired from the managed database below rather than pasted. A blueprint cannot
      # interpolate values into a string, so the parts are used instead of
      # DATABASE_JDBC_URL — hand-assembling a JDBC URL is precisely the step that
      # variable was named to stop people getting wrong.
      - key: DATABASE_HOST
        fromDatabase:
          name: lumen-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: lumen-postgres
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: lumen-postgres
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: lumen-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: lumen-postgres
          property: password

      # sync: false means Render asks for the value and never stores it in this file.
      # Generate the two secrets, never reuse the development values committed in
      # application.yml — the application refuses to start if it finds them.
      #   JWT_SECRET      openssl rand -base64 48
      #   ENCRYPTION_KEY  openssl rand -base64 32   (must decode to exactly 32 bytes)
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # The Vercel origin the frontend is served from. Used for CORS and for the
      # WebSocket handshake, so a mismatch breaks the live dashboard, not just fetches.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        sync: false
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      # Optional. Left unset, the companion answers from the mock client and costs
      # nothing; the guardrails and the crisis flow work either way.
      - key: LLM_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: lumen-postgres
    plan: free
    # Only the API should reach it.
    ipAllowList: []

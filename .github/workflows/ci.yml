name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (build, test, checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build, test and check
        run: ./gradlew build

      - name: Summarise test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import collections
          import glob
          import re
          import xml.etree.ElementTree as ET

          groups = collections.defaultdict(list)
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      body = node.text or ''
                      # The last "Caused by" is the root cause; the message alone is
                      # usually Spring restating that a context failed to load.
                      causes = re.findall(r'^Caused by: .*$', body, re.M)
                      head = (node.get('message') or '').strip().splitlines()
                      root = causes[-1].strip() if causes else (head[0] if head else kind)
                      groups[root].append(case.get('classname') + '.' + case.get('name'))

          for root, tests in sorted(groups.items(), key=lambda kv: -len(kv[1])):
              print(str(len(tests)) + ' failing on: ' + root[:700])
              for t in tests[:4]:
                  print('    ' + t)
              if len(tests) > 4:
                  print('    ... and ' + str(len(tests) - 4) + ' more')
              print('-' * 72)
          PY

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

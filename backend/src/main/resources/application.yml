spring:
  application:
    name: lumen
  profiles:
    active: dev

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped by tag rather than by controller class, so the page reads as
    # the product does (auth, check-in, instruments, crisis, ...) and not as the package tree.
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  # Dev-only defaults below — production (Fase 7) MUST override via real environment
  # variables. Never commit a real secret here.
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdefghijklmnop}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  encryption:
    key: ${ENCRYPTION_KEY:zxLVCSUFSFXj60TnIb6R7L+4Y0jAPDe62VKLIvTkjqI=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  llm:
    # "mock" (default) never calls a network and never costs anything — set to
    # "anthropic" + provide ANTHROPIC_API_KEY to use the real companion.
    provider: ${LLM_PROVIDER:mock}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    anthropic-timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:20}

# Resilience only where a real external dependency can actually fail (see ADR-0010):
# the Anthropic call. Retry only wraps complete() (the synchronous summarization
# call) — completeStreaming() is deliberately excluded from retry because a partial
# stream may already have reached the person; retrying it risks duplicated content.
# Both share the same circuit breaker, since both hit the same upstream API.
resilience4j:
  retry:
    instances:
      anthropic-llm:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      anthropic-llm:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:lumen}
    username: ${POSTGRES_USER:lumen}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev-seed
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:lumen}
    password: ${RABBITMQ_DEFAULT_PASS:changeme}

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Hard-pinned regardless of any LLM_PROVIDER/ANTHROPIC_API_KEY present in the
# environment — automated tests must never be able to reach the real API.
app:
  llm:
    provider: mock

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # DATABASE_JDBC_URL, not DATABASE_URL: Render, Railway and Heroku all inject a
    # DATABASE_URL of their own in postgres://user:pass@host/db form, which is not a
    # JDBC URL. Reusing that name means the platform silently supplies a value the
    # driver cannot parse. The name says which format is expected.
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Only db/migration. The dev-seed location plants a demo account with a known
    # password, and inheriting the dev list here would put it in production.
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # No /actuator/info in production: it is unauthenticated (SecurityConfig) and
        # exists to describe the build, which is free reconnaissance for no benefit.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  # Every one of these is deliberately written without a fallback. An unresolvable
  # placeholder stops the application from starting, which is the only acceptable
  # failure mode: a production instance that boots with the dev secret committed in
  # this repository is one that anyone reading the repository can forge tokens for.
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
